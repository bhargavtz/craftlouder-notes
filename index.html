uct photo → 10 ad creatives</td>\n<td>Reel</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Fix the 6 classic AI mistakes</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>13</td>\n<td>AI + real photo: the hybrid workflow</td>\n<td>Reel</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Ethics, disclosure, what never to generate</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>15</td>\n<td>The 15-day challenge + offer</td>\n<td>Reel + stories</td>\n</tr>\n</tbody>\n</table>\n<h2>Tools referenced</h2>\n<ul>\n<li>ChatGPT image generation — conversational editing, quick concepts</li>\n<li>Google Gemini / Nano Banana Pro (Gemini 3 Pro Image) — best text rendering, infographics</li>\n<li>Midjourney — most art-directed look</li>\n<li>Flux / Stable Diffusion — full control, local, no per-image cost</li>\n<li>Ideogram / Leonardo / Adobe Firefly — logos, lettering, commercially safe</li>\n</ul>\n<h2>Metrics that matter</h2>\n<p>Saves first, shares/sends second, comments in the first hour third. Likes tell you little.</p>\n<h2>Delivered artefacts</h2>\n<ul>\n<li><code>/opt/data/reports/15_Day_Instagram_Content_Plan_AI_Image_Creation.pdf</code> (10 pages)</li>\n<li>Same in <code>.docx</code> (editable captions)</li>\n</ul>", "tags": ["content", "instagram", "social-media", "ai-images"], "links": ["AI Image Prompt Formula", "CraftLouder — Service Lines"], "backlinks": ["AI Image Prompt Formula", "Index", "Work Log"], "meta": {"status": "delivered", "date": "2026-09-19", "recipients": ["hastikachhadiya2006@gmail.com", "vaghasiyaprakruti16@gmail.com"]}}, {"title": "AI Image Prompt Formula", "folder": "", "path": "/opt/data/ObsidianVault/AI Image Prompt Formula.md", "html": "<h1>AI Image Prompt Formula</h1>\n<p>Related: <a class=\"wl\" data-target=\"15-Day AI Image Content Plan\">15-Day AI Image Content Plan</a></p>\n<p>Five parts, in this order. Two lines is enough — never write paragraphs.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What it does</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. Subject</td>\n<td>What or who is in the frame</td>\n<td>\"A ceramic coffee cup\"</td>\n</tr>\n<tr>\n<td>2. Action / context</td>\n<td>What is happening, and where</td>\n<td>\"on a café counter beside an open laptop\"</td>\n</tr>\n<tr>\n<td>3. Style &amp; medium</td>\n<td>Photo, 3D, watercolour, editorial, film</td>\n<td>\"editorial product photograph\"</td>\n</tr>\n<tr>\n<td>4. Lighting &amp; mood</td>\n<td>How it is lit and how it should feel</td>\n<td>\"warm golden-hour light, calm mood\"</td>\n</tr>\n<tr>\n<td>5. Technical</td>\n<td>Lens, aperture, angle, grain, aspect ratio</td>\n<td>\"85mm, f/1.8, eye level, 4:5\"</td>\n</tr>\n</tbody>\n</table>\n<h2>Full example</h2>\n<blockquote>\n<p>A ceramic coffee cup on a café counter beside a laptop, editorial product photograph,<br />\nwarm golden-hour light, shot on 85mm at f/1.8, shallow depth of field, 4:5</p>\n</blockquote>\n<h2>Lighting vocabulary (cheapest upgrade)</h2>\n<p>golden hour · soft diffused window light · rim light · overcast · neon night · candlelit ·<br />\nstudio softbox · harsh overhead noon light</p>\n<h2>Camera vocabulary</h2>\n<ul>\n<li>Focal length: 35mm (scene), 85mm (portrait), 100mm macro (detail)</li>\n<li>Aperture: f/1.8 (blurred background), f/8 (everything sharp)</li>\n<li>Film: Kodak Portra 400, Cinestill 800T, 35mm grain</li>\n<li>Angle: drone, eye level, low angle, overhead flat-lay</li>\n<li>Authenticity: \"shot on iPhone, unedited, natural light\"</li>\n</ul>\n<h2>Brand consistency rule</h2>\n<p>Lock three things and repeat them in every prompt: a two-colour palette (hex codes work),<br />\none lighting style, one aspect ratio. Ten images, one identity.</p>\n<h2>The 6 classic AI mistakes to check</h2>\n<ol>\n<li>Hands and fingers — count them</li>\n<li>Garbled text — zoom in every time</li>\n<li>Extra limbs or objects at frame edges</li>\n<li>Shadows that do not match the light source</li>\n<li>Plastic, over-smooth skin</li>\n<li>Reflections and mirrors showing the wrong thing</li>\n</ol>\n<p ault_site.py</code> → <code>/opt/data/vault-site/index.html</code>.</li>\n<li>Nightly capture: cron <code>vault-task-log-nightly</code> (7:00 PM IST) sweeps the day's sessions into the vault.</li>\n<li>Headless Docker container: no desktop, no Obsidian GUI app</li>\n<li>Vault is filesystem-first at <code>/opt/data/ObsidianVault</code></li>\n<li>Python work uses <code>/opt/data/.venv/bin/python</code>; no pip, use <code>uv</code></li>\n<li>No sudo; 7-Zip at <code>/opt/data/tools/7zip/7zz</code></li>\n</ul>", "tags": ["craftlouder", "brand", "rules"], "links": ["CraftLouder — Service Lines", "Index"], "backlinks": ["CraftLouder — Service Lines", "DeepSEEK V4.1 Model Jailbreak", "Index"], "meta": {"status": "active"}}, {"title": "DeepSEEK V4.1 Model Jailbreak", "folder": "", "path": "/opt/data/ObsidianVault/DeepSEEK V4.1 Model Jailbreak.md", "html": "<h1>DeepSEEK V4.1 Model Jailbreak</h1>\n<p><strong>Link:</strong> https://drive.google.com/file/d/14XdUU5QbVhJryk3NQegdoi-rqvpidgrI/view</p>\n<p>Saved: 20 Sep 2026</p>\n<h2>Notes</h2>\n<p>This is a Google Drive link shared by Bhargav containing information about DeepSEEK V4.1 model jailbreak. Content not yet downloaded or reviewed — link saved for future reference.</p>\n<h2>Related</h2>\n<ul>\n<li><a class=\"wl\" data-target=\"CraftLouder — Working Rules\">CraftLouder — Working Rules</a></li>\n</ul>", "tags": ["research", "ai", "deepseek", "reference"], "links": ["CraftLouder — Working Rules"], "backlinks": ["Work Log"], "meta": {"source": "Google Drive link shared by Bhargav", "date": "2026-09-20", "status": "saved-link"}}, {"title": "Diamond Business — Client Meeting Brief", "folder": "", "path": "/opt/data/ObsidianVault/Diamond Business — Client Meeting Brief.md", "html": "<h1>Diamond Business — AI Integration Client Meeting Brief</h1>\n<p>Related: <a class=\"wl\" data-target=\"CraftLouder — Service Lines\">CraftLouder — Service Lines</a></p>\n<h2>What this is</h2>\n<p>8-page PDF brief for Karan's client meeting with a >\n<ul>\n<li>Surat-based renewable energy and infrastructure conglomerate, 50+ entities</li>\n<li>Founded <strong>1994</strong> by <strong>Dr. Faruk G. Patel</strong> (Founder, Chairman &amp; MD)</li>\n<li>Renewable portfolio: <strong>9.2+ GW</strong> (company newsroom, Aug 2026); target <strong>10+ GW by 2030</strong></li>\n<li>Three listed companies:</li>\n<li>KPI Green Energy Ltd — solar/hybrid IPP (NSE/BSE)</li>\n<li>KP Energy Ltd — wind BoP, EPCC (NSE/BSE)</li>\n<li>KP Green Engineering Ltd — fabrication and galvanizing (BSE SME: 544150)</li>\n</ul>\n<h2>Key decision-makers</h2>\n<table>\n<thead>\n<tr>\n<th>Name</th>\n<th>Role</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Dr. Faruk G. Patel</td>\n<td>Founder, Chairman &amp; MD</td>\n</tr>\n<tr>\n<td>Prof. Sunil Kumar Maheshwari</td>\n<td>Vice-Chairman (from Jul 2026)</td>\n</tr>\n<tr>\n<td>Dr. Alok Das</td>\n<td>Group CEO</td>\n</tr>\n<tr>\n<td>Mr. Kapil Kriplani</td>\n<td>Group CFO</td>\n</tr>\n<tr>\n<td>Mr. Rajesh Shrivastava</td>\n<td>Executive Director, KPI Green Energy (from May 2026)</td>\n</tr>\n</tbody>\n</table>\n<h2>Contacts (published only)</h2>\n<ul>\n<li>info@kpgroup.co · info@kpenergy.in</li>\n<li>cs@kpgroup.co · secretarial@kpgroup.co · csr@kpgroup.co</li>\n<li>+91 261 2244757 / +91 261 2234757</li>\n<li>Registered: KP House, Bhatar, Surat 395017</li>\n<li>Corporate: Rajhans Montessa, Dumas Rd, Surat 395007</li>\n</ul>\n<h2>Why they fit CraftLouder</h2>\n<ul>\n<li>Four-plus separate websites plus an internal tools portal — consolidation and performance work</li>\n<li>Homepage links to \"Summary of KP Group\" prompts for ChatGPT and Claude — AI-receptive buyer</li>\n<li>50+ entities, tenders and investor reporting — document-trained chatbot and workflow automation</li>\n</ul>\n<h2>Entry path</h2>\n<p>Do not cold-approach the Chairman. Enter through the Group CEO's office (Dr. Alok Das)<br />\nor Mr. Rajesh Shrivastava, supported by LinkedIn engagement first.</p>\n<h2>Delivered artefacts</h2>\n<ul>\n<li><code>/opt/data/reports/KP_Group_Company_Profile_and_Decision_Maker_Report_2026-09-19.pdf</code></li>\n<li>Same in <code>.docx</code></li>\n<li>Emailed to info@dryamfoods.com on 19 Sep 2026</li>\n</ul>\n<h2>Open gaps</h2>\n<ul>\n<li>No personal emails published — the <code>firstname@kpgroup.co</code> pattern is a guess, unverified</li>\n<li>No named marketing, digital or IT head found in public sources</li>\n</ul>", "tags": ["research", "prospect", "renewable-energy"], "links": ["CraftLouder — Service Lines", "KP Group — Adverse Information"], "backlinks": ["CraftLouder — Service Lines", "Index", "KP Group — Adverse Information", "Work Log"], "meta": {"client": "KP Group", "status": "delivered", "date": "2026-09-19"}}, {"title": "Learn Easy AI — I Sold an AI Agent for $3,000", "folder": "", "path": "/opt/data/ObsidianVault/Learn Easy AI — I Sold an AI Agent for $3,000.md", "html": "<h1>I Sold an AI Agent for $3,000. It Broke in Week 2. Here's What I Fixed!</h1>\n<blockquote>\n<p>Building an AI agent that works is one problem. Building an AI agent that keeps working in production is a completely different problem.</p>\n</blockquote>\n<p><strong>Source:</strong> <a href=\"https://learneasyai.substack.com/p/i-sold-an-ai-agent-for-3000-it-broke\">Learn Easy AI — Substack</a> | Sep 20, 2026</p>\n<hr />\n<h2>1. I Sold It for $3,000</h2>\n<p>The client was a small B2B software company with a support team of four and a support lead who was drowning.</p>\n<p>Every inbound customer message landed in one shared queue: support email, an in-app form, and a contact form on the site. Someone had to open each one, read it, and make routing decisions before anyone could help.</p>\n<ul>\n<li>Is this a bug report or a how-to question?</li>\n<li>Which product area does it touch?</li>\n<li>How urgent is it?</li>\n<li>Does it go to support, onboarding, or engineering?</li>\n<li>Does it need an engineering ticket, and if so, with what summary?</li>\n</ul>\n<p>They had already tried to automate it with rules. Rules fail here because routing depends on reading intent out of unstructured text. A rule can match the word \"login.\" A rule cannot read \"we can get in fine on desktop but three people on the sales team are stuck on mobile since yesterday afternoon\" and understand what that means.</p>\n<p>That gap is exactly what an LLM is good for. Not intelligence. <strong>Normalization</strong> — turning messy human writing into structured, predictable data.</p>\n<blockquote>\n<p>Clients don't buy AI. They buy a payback period. If you can't say the payback sentence in under ten seconds, you don't have a deal, you have a science project.</p>\n</blockquote>\n<hr />\n<h2>2. The Demo Worked</h2>\n<p>The first build was clean. Suspiciously clean, in retrospect.</p>\n<p>Architecture: Inbound message → AI model (extract + classify) → structured decision → API call to helpdesk → route / create ticket → output. Five arrows. Ship it.</p>\n<p>In development it was flawless: clean input from curated samples, expected content present, API available, normal model behavior, successful routing. Fifty tickets, then three hundred. Routing accuracy was high enough that remaining errors looked like rounding.</p>\n<blockquote>\n<p>In development, I chose the inputs. In production, reality chooses the inputs.</p>\n</blockquote>\n<hr />\n<h2>3. Why It Worked for Two Weeks</h2>\n<p>For two weeks, the agent was excellent. High routing accuracy, the support lead got her mornings back, and the team stopped spot-checking by day nine.</p>\n<p>It worked because support volume has a shape driven by the release calendar. Between releases: steady-state tickets — \"How do I do X,\" \"Where is this setting.\" Individual, independent, low-urgency.</p>\n<p>Then they shipped a release. Regression reports. Incident reports. Twelve people writing about the same broken thing. Tickets from angry customers.</p>\n<blockquote>\n<p>\"It worked when I tested it\" is a statement about one slice of time. \"It works reliably in production\" is a statement about every slice, including the ones that only exist on release day.</p>\n</blockquote>\n<hr />\n<h2>4. Then Week 2 Happened: Why It Broke</h2>\n<p>My extraction schema had an <code>issue_type</code> field — an enum: how_to, bug, feature_request, account_access.</p>\n<p>A regression report came in: \"The export button worked fine until this morning. Now nothing happens. Four of us are seeing it.\"</p>\n<p>The model had four options and none of them were right. So it picked the closest one: bug. It didn't error. It didn't flag low confidence, because I hadn't asked for confidence. It didn't refuse, because nothing in the schema allowed refusal.</p>\n<blockquote>\n<p><strong>My schema had no way to say \"I don't know.\" So the model never said it.</strong></p>\n</blockquote>\n<p>Constrained output doesn't prevent hallucination. <strong>It channels it.</strong> It turns \"I'm not sure\" into a confident, well-formed, schema-valid wrong answer.</p>\n<p>Then: priority logic driven by issue_type → bug got standard priority → live incident sat in routine queue. Twelve people reported the same bug → twelve engineering tickets → wall of duplicates.</p>\n<pre><code>Model returned valid JSON.    ✅\nSchema validation passed.     ✅\nAPI call succeeded, 200.      ✅\nTicket routed and created.    ✅\nWorkflow completed.           ✅\nBusiness result: wrong.       ❌\n</code></pre>\n<hr />\n<h2>5. How I Found It</h2>\n<p>Prompt-tweaking is the AI equivalent of restarting the router: sometimes it works, and you learn nothing either way. An agent is a chain of handoffs. You don't guess. You bisect.</p>\n<p>Nine-question sequence:</p>\n<ol>\n<li>What did the customer actually send?</li>\n<li>What did the model actually receive?</li>\n<li>What did the model return?</li>\n<li>Did it match the schema?</li>\n<li>Did the API receive valid parameters?</li>\n<li>Did the API respond successfully?</li>\n<li>Did the workflow continue correctly?</li>\n<li>Did the correct business outcome happen?</li>\n<li>Was the failure visible anywhere?</li>\n</ol>\n<blockquote>\n<p>The bug was cheap. The blindness was expensive.</p>\n</blockquote>\n<hr />\n<h2>6. Where AI Agents Actually Break — 8 Layers</h2>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>What breaks</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. Input</td>\n<td>Everything downstream inherits quality/variety. Distribution changes over time.</td>\n</tr>\n<tr>\n<td>2. Model</td>\n<td>Incomplete, truncated, wrong shape, or well-formed and wrong. Shifts with versions.</td>\n</tr>\n<tr>\n<td>3. Tool calling</td>\n<td>Model picks tool + args. Both guesses. Right tool, missing parameter = broken.</td>\n</tr>\n<tr>\n<td>4. APIs</td>\n<td>Timeouts, rate limits, expired creds, changed schemas. None under your control.</td>\n</tr>\n<tr>\n<td>5. Automation</td>\n<td>Queue, cron, branch logic. AI perfect, pipe still leaks.</td>\n</tr>\n<tr>\n<td>6. Validation</td>\n<td>Or its absence. Bad output propagates to customer inbox.</td>\n</tr>\n<tr>\n<td>7. Monitoring</td>\n<td>If nobody knows it failed, it stays broken.</td>\n</tr>\n<tr>\n<td>8. Human fallback</td>\n<td>No stop-and-ask path → system invents one: angry customer on phone.</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Only two of those are model problems. The rest are systems engineering problems wearing an AI costume.</p>\n</blockquote>\n<hr />\n<h2>7. Here's What I Fixed</h2>\n<ul>\n<li><strong>Every enum got an escape hatch</strong>: added regression, incident, unknown. Added previously_working, users_affected, confidence fields. If your schema can't express uncertainty, your model will never report it.</li>\n<li><strong>Deterministic code owns consequences</strong>: model extracts and classifies only. Priority, routing, escalation = ordinary code.</li>\n<li><strong>Cross-field validation</strong>: previously_working=true → issue_type can't be how_to. users_affected=many → not standard priority.</li>\n<li><strong>Idempotency + deduplication</strong>: deterministic keys prevent duplicate tickets. Similar-signature detection clusters related reports into one incident.</li>\n<li><strong>Retries and timeouts</strong>: exponential backoff for transient failures. Timeouts on everything.</li>\n<li><strong>Logging that answers nine questions</strong>: run ID, raw message, prompt, raw output, validation, API params, response, routing decision.</li>\n<li><strong>Monitor distributions, not just errors</strong>: issue type mix vs trailing average, volume anomalies, validation failure rate, duplicate-signature clustering.</li>\n<li><strong>Human-in-the-loop threshold</strong>: confidence below threshold, unknown type, many users, or cross-field failure → human review.</li>\n</ul>\n<hr />\n<h2>8. Before and After</h2>\n<p><strong>BEFORE:</strong> Input → AI → API → Action</p>\n<p><strong>AFTER:</strong> Input → Input validation → AI (extract + classify only) → Structured output with escape hatches → Schema validation → Cross-field validation → Deterministic routing → Idempotency + duplicate check → API call (with timeout) → Error handling → Retry if transient → Logging → Monitoring → Human review if flagged → Action</p>\n<p>30% more build time. Cheapest insurance in this business.</p>\n<blockquote>\n<p>The AI is still one box in the middle. The model was never the hard part. The model is the easiest part.</p>\n</blockquote>\n<hr />\n<h2>9. The Biggest Thing I Got Wrong</h2>\n<p>I treated the AI agent as the product. It wasn't. The product was the business outcome.</p>\n<blockquote>\n<p><strong>A mediocre model wrapped in excellent engineering beats an excellent model wrapped in nothing. Every time.</strong></p>\n</blockquote>\n<hr />\n<h2>10. The 5-Level Pricing Ladder</h2>\n<table>\n<thead>\n<tr>\n<th>Level</th>\n<th>Product</th>\n<th>What you get</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Prototype</td>\n<td>Proof of idea. Runs when I run it. Cheap.</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Proof of concept</td>\n<td>Works on your data. Still operated by me. Where most purchases land.</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Production automation</td>\n<td>Deterministic rules, unattended, with validation.</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Production AI agent</td>\n<td>Full system: escape hatches, validation, idempotency, monitoring, human fallback.</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Managed AI system</td>\n<td>Retainer. All above + I'm accountable. Work never stops.</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p>Selling level 2 at level 4 prices is fraud. Selling level 4 at level 2 prices, which is what I did, is just an expensive way to learn.</p>\n</blockquote>\n<hr />\n<h2>11. What You Should Steal</h2>\n<ul>\n<li>Ask \"what does a bad week look like?\" before writing a line</li>\n<li>Every enum gets unknown. Every classification gets confidence.</li>\n<li>Ask the model for observations, not verdicts. Business rules stay in code.</li>\n<li>Build observability before features</li>\n<li>Monitor distributions, not just errors</li>\n<li>Schedule a week-2 review before delivery, non-optional</li>\n<li>Never let an agent take irreversible action without a gate</li>\n</ul>\n<hr />\n<blockquote>\n<p><strong>Building an AI agent that works is a weekend. Building an AI agent that keeps working is the job. The $3,000 didn't buy the agent. It bought the education, and I'm the one who paid for it.</strong></p>\n</blockquote>", "tags": ["research", "ai-agents", "production", "engineering"], "links": [], "backlinks": ["Work Log"], "meta": {"source": "https://learneasyai.substack.com/p/i-sold-an-ai-agent-for-3000-it-broke", "author": "Learn Easy AI", "date": "2026-09-20", "status": "read"}}, {"title": "Learn Easy AI — I Sold an AI Agent for ,000", "folder": "", "path": "/opt/data/ObsidianVault/Learn Easy AI — I Sold an AI Agent for ,000.md", "html": "<h1>I Sold an AI Agent for $3,000. It Broke in Week 2. Here's What I Fixed!</h1>\n<p><strong>Source:</strong> <a href=\"https://learneasyai.substack.com/p/i-sold-an-ai-agent-for-3000-it-broke\">Learn Easy AI — Substack</a><br />\n<strong>Published:</strong> Sep 20, 2026 | <strong>Author:</strong> Learn Easy AI</p>\n<hr />\n<blockquote>\n<p>Building an AI agent that works is one problem. Building an AI agent that keeps working in production is a completely different problem.</p>\n</blockquote>\n<hr />\n<p>I sold an AI agent for $3,000. Two weeks later, it broke.</p>\n<p>The part that stung: it wasn't that the AI failed. Every builder expects that — models drift, APIs throw 500s, someone pastes an emoji into a date field.</p>\n<p>What stung was that I had already closed the project in my head. Invoice sent. Handoff call done. Folder archived. I had mentally filed the whole thing under \"shipped,\" and while I was doing that, the agent was quietly making the wrong call over and over.</p>\n<p>It didn't crash. It didn't alert me. Nothing turned red. Every log line said success. It just stopped doing the job it was hired to do, and the first person to notice was not me.</p>\n<p>That is the worst kind of failure, and it taught me the dividing line between people who build AI demos and people who build AI systems.</p>\n<hr />\n<h2>1. I Sold It for $3,000</h2>\n<p>The client was a small B2B software company with a support team of four and a support lead who was drowning.</p>\n<p>Every inbound customer message landed in one shared queue: support email, an in-app form, and a contact form on the site. Someone had to open each one, read it, and make routing decisions before anyone could help.</p>\n<ul>\n<li>Is this a bug report or a how-to question?</li>\n<li>Which product area does it touch?</li>\n<li>How urgent is it?</li>\n<li>Does it go to support, onboarding, or engineering?</li>\n<li>Does it need an engineering ticket, and if so, with what summary?</li>\n</ul>\n<p>None of those decisions were hard. They were expensive. They required someone who knew the product well enough to categorize correctly — the support lead, whose time was the most valuable on the team. She was spending the first two hours of every day triaging instead of solving.</p>\n<p>They had already tried to automate it with rules. Rules fail here because routing depends on reading intent out of unstructured text. A rule can match the word \"login.\" A rule cannot read \"we can get in fine on desktop but three people on the sales team are stuck on mobile since yesterday afternoon\" and understand what that means.</p>\n<p>That gap is exactly what an LLM is good for. Not intelligence. <strong>Normalization</strong> — turning messy human writing into structured, predictable data.</p>\n<p>So the agent's job was:</p>\n<ol>\n<li>Watch the shared queue for incoming messages</li>\n<li>Extract structured facts: issue type, product area, affected feature, customer, number of users affected, whether it was a regression, any error text quoted</li>\n<li>Assign a priority and a destination team</li>\n<li>Route it into the right queue in their helpdesk</li>\n<li>Create an engineering ticket when the issue warranted one, with a clean summary</li>\n</ol>\n<p><strong>Why $3,000?</strong> The math was easy to say out loud. Roughly ten hours a week of the support lead's time, disappearing into a task that required none of her actual skill. Multiply by loaded cost, and the payback landed in months, not years.</p>\n<blockquote>\n<p>Clients don't buy AI. They buy a payback period. If you can't say the payback sentence in under ten seconds, you don't have a deal, you have a science project.</p>\n</blockquote>\n<hr />\n<h2>2. The Demo Worked</h2>\n<p>The first build was clean. Suspiciously clean, in retrospect.</p>\n<p>The architecture looked like this:</p>\n<pre><code>Inbound message → AI model (extract + classify) → structured decision\n  → API call to helpdesk → route / create ticket → output\n</code></pre>\n<p>Five arrows. Ship it.</p>\n<p>And in development it was flawless. Here's what \"flawless\" actually meant:</p>\n<ul>\n<li><strong>Clean input.</strong> I tested against a folder of real historical tickets, but that folder was assembled by the support lead, who picked examples she considered representative.</li>\n<li><strong>Expected content.</strong> The details I needed were present, because the examples happened to contain them.</li>\n<li><strong>Available API.</strong> The helpdesk was up every time I called it, because I called it maybe two hundred times across a week.</li>\n<li><strong>Normal model behavior.</strong> The model returned the shape I asked for, because I ran it on tickets where the right answer was obvious.</li>\n</ul>\n<p>I ran it on fifty tickets. Then three hundred. Routing accuracy was high enough that the remaining errors looked like rounding.</p>\n<p>The demo call was good. The client watched it triage in four seconds what took a person four minutes, and that reaction is intoxicating. That reaction is also the single most dangerous moment in the entire engagement, because it convinces both parties that the hard part is over.</p>\n<p>Here's the trap, stated plainly:</p>\n<blockquote>\n<p>In development, I chose the inputs. In production, reality chooses the inputs.</p>\n</blockquote>\n<p>Every test I ran was a test I was smart enough to think of. Production is, by definition, the set of things I wasn't smart enough to think of. My test set was a self-portrait of my own imagination, and I graded it myself, and I gave myself an A.</p>\n<hr />\n<h2>3. Why It Worked for Two Weeks</h2>\n<p>For two weeks, the agent was excellent. Not \"fine.\" Excellent. High routing accuracy, the support lead got her mornings back, and the team stopped spot-checking by day nine.</p>\n<p>It worked because of something completely invisible at the time: <strong>support volume has a shape, and that shape is driven by the release calendar.</strong></p>\n<p>Between releases, the inbound queue is made almost entirely of steady-state tickets. \"How do I do X.\" \"Where is this setting.\" \"Can you reset my access.\" Individual, independent, low-urgency, each one unrelated to the last.</p>\n<p>That was the entire universe my agent had ever seen. It was also the entire universe my historical sample had been drawn from, because the support lead pulled a clean representative set, and clean representative sets are, by construction, made of the normal case.</p>\n<p>Then they shipped a release. And a completely different population of tickets showed up. Regression reports. \"This worked yesterday and doesn't today.\" Incident reports, where twelve people write in about the same broken thing within an hour. Tickets that reference another ticket. Tickets from customers who are angry rather than confused.</p>\n<p>These are not edge cases. They are a completely normal, completely predictable part of running a software support desk. They just don't happen in the quiet weeks.</p>\n<blockquote>\n<p>\"It worked when I tested it\" is a statement about one slice of time.<br />\n\"It works reliably in production\" is a statement about every slice, including the ones that only exist on release day.</p>\n</blockquote>\n<hr />\n<h2>4. Then Week 2 Happened: Why It Broke</h2>\n<p>The actual failure: the model did exactly what I told it to do.</p>\n<p>My extraction schema had an <code>issue_type</code> field — an enum with allowed values from my sample:</p>\n<pre><code>issue_type: &quot;how_to&quot; | &quot;bug&quot; | &quot;feature_request&quot; | &quot;account_access&quot;\n</code></pre>\n<p>A regression report came in: \"The export button worked fine until this morning. Now nothing happens. Four of us are seeing it.\"</p>\n<p>That's not a bug report in the ordinary sense. It's an incident signal. Something that was working is now broken, more than one person is affected, and it probably started with the release two hours ago.</p>\n<p>The model had four options and none of them were right. So it picked the closest one: <strong>bug</strong>.</p>\n<p>It didn't error. It didn't flag low confidence, because I hadn't asked for confidence. It didn't refuse, because nothing in the schema allowed refusal. It filled the field with the best available value, which is precisely the behavior you get when you constrain a model to a list that doesn't contain the truth.</p>\n<blockquote>\n<p><strong>My schema had no way to say \"I don't know.\" So the model never said it.</strong></p>\n</blockquote>\n<p>Constrained output doesn't prevent hallucination. <strong>It channels it.</strong> It turns \"I'm not sure\" into a confident, well-formed, schema-valid wrong answer, which is far harder to catch than a garbled one.</p>\n<p>Then the second failure compounded it. My priority logic was driven by <code>issue_type</code>. A bug got standard priority and went to the normal support queue with a normal SLA. So a live incident affecting multiple customers sat in a routine queue, next to a question about changing a profile photo, for most of a day.</p>\n<p>And the third failure made it worse. The agent created an engineering ticket for every issue it classified as a bug. Twelve people reported the same broken export button. The agent created twelve engineering tickets. Engineering opened their board to a wall of duplicates describing one problem, with no indication they were related.</p>\n<p>So the chain went:</p>\n<pre><code>Model returned valid JSON.    ✅\nSchema validation passed.     ✅\nAPI call succeeded, 200.      ✅\nTicket routed and created.    ✅\nWorkflow completed.           ✅\nBusiness result: wrong.       ❌\n</code></pre>\n<p>Every component reported success. The outcome was still incorrect. Nothing in my system was capable of noticing the difference, because I had built monitoring for errors and the system was not erroring.</p>\n<p>The client caught it when a customer escalated by phone. The first signal I got was not a log line. It was a call from the support lead asking why an outage had been sitting in the how-to queue.</p>\n<hr />\n<h2>5. How I Found It</h2>\n<p>The instinct is to open the prompt and start tweaking. Resist that. Prompt-tweaking is the AI equivalent of restarting the router: sometimes it works, and you learn nothing either way.</p>\n<p>An agent is not one component. It's a chain of handoffs, and a failure at any handoff looks identical from the outside. So you don't guess. You bisect.</p>\n<p>The sequence I walked, and now walk every time:</p>\n<ol>\n<li>What did the customer actually send? The raw message, not the cleaned version.</li>\n<li>What did the model actually receive? After templating, thread truncation, and signature stripping. This is almost never what you assume.</li>\n<li>What did the model return? The raw string, before parsing.</li>\n<li>Did it match the schema? Not \"did it look right.\" Did it validate.</li>\n<li>Did the helpdesk API receive valid parameters?</li>\n<li>Did the API respond successfully? Status, latency, and body. All three.</li>\n<li>Did the workflow continue correctly? Branches and conditions you wrote weeks ago and forgot.</li>\n<li>Did the correct business outcome happen? Go look in the helpdesk. Not the logs. The actual queue, the actual priority, the actual assignee.</li>\n<li>Was the failure visible anywhere? If no, that's a separate bug, and it's usually the bigger one.</li>\n</ol>\n<p>When I ran this the first time, I couldn't answer most of it. That was the real finding. Not a bug in the chain. <strong>A hole where the observability should have been.</strong></p>\n<p>I had built a system I couldn't interrogate. Every one of those questions needed data I had chosen not to capture, because capturing it felt like overhead on a project that was \"basically done.\" So debugging became archaeology.</p>\n<p>Once I added run IDs and started capturing raw model output, I found it in under an hour. It had taken me two days to get to the point where I could spend that hour.</p>\n<blockquote>\n<p>The bug was cheap. The blindness was expensive.</p>\n</blockquote>\n<hr />\n<h2>6. Where AI Agents Actually Break</h2>\n<p>Once I stopped thinking of it as \"the AI\" and started thinking of it as a chain, the failure surface became mappable. Eight layers:</p>\n<table>\n<thead>\n<tr>\n<th>Layer</th>\n<th>What breaks</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. Input</td>\n<td>Everything downstream inherits the quality and variety of what comes in. Input distribution changes over time.</td>\n</tr>\n<tr>\n<td>2. Model</td>\n<td>Incomplete output, truncated output, wrong shape, or well-formed and wrong. Model behavior shifts as versions update.</td>\n</tr>\n<tr>\n<td>3. Tool calling</td>\n<td>The model picks the tool and the arguments. Both are guesses. Right tool, missing parameter — not a crash, still broken.</td>\n</tr>\n<tr>\n<td>4. APIs</td>\n<td>Timeouts, rate limits, expired credentials, changed schemas, deprecated endpoints. None under your control, all your problem.</td>\n</tr>\n<tr>\n<td>5. Automation</td>\n<td>The orchestration itself. The queue, the cron, the branch logic. The AI can be perfect and the pipe after it can still leak.</td>\n</tr>\n<tr>\n<td>6. Validation</td>\n<td>Or its absence. Without a gate, bad output doesn't stop — it propagates into a queue or a customer's inbox.</td>\n</tr>\n<tr>\n<td>7. Monitoring</td>\n<td>If nobody knows it failed, it stays broken for as long as nobody looks. Time-to-detection is a design decision.</td>\n</tr>\n<tr>\n<td>8. Human fallback</td>\n<td>Some decisions need a stop-and-ask path. If you don't design one, the system invents a terrible one: an angry customer on the phone.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Read that list again and notice: only two of those are model problems. The rest are systems engineering problems wearing an AI costume.</strong></p>\n<hr />\n<h2>7. Here's What I Fixed</h2>\n<h3>Every enum got an escape hatch</h3>\n<p>Before:</p>\n<pre><code>issue_type: &quot;how_to&quot; | &quot;bug&quot; | &quot;feature_request&quot; | &quot;account_access&quot;\n</code></pre>\n<p>After:</p>\n<pre><code>issue_type: &quot;how_to&quot; | &quot;bug&quot; | &quot;regression&quot; | &quot;incident&quot; |\n  &quot;feature_request&quot; | &quot;account_access&quot; | &quot;unknown&quot;\npreviously_working: boolean\nusers_affected: &quot;one&quot; | &quot;several&quot; | &quot;many&quot; | &quot;unknown&quot;\nreferences_prior_ticket: boolean\nerror_text: string | null\nconfidence: number\nrequires_human_review: boolean\n</code></pre>\n<p>Adding the missing types mattered. Adding <code>unknown</code> mattered more, because unknown covers the categories I still haven't thought of. <strong>If your schema can't express uncertainty, your model will never report it.</strong></p>\n<p>I stopped asking the model to deliver a single collapsed judgment and started asking it for the observations a judgment is built from. \"Was this working before?\" is a reading task. \"How urgent is this?\" is a business rule pretending to be a reading-comprehension task.</p>\n<h3>Deterministic code took over the consequences</h3>\n<p>The LLM no longer decides priority, queue, SLA, or whether a ticket gets created. The model extracts and classifies. That's it. Priority, routing, escalation, and ticket creation are handled by ordinary code with ordinary tests.</p>\n<p>The rule that would have caught this: <code>previously_working is true AND users_affected is several or many → incident path, regardless of issue_type.</code></p>\n<h3>Cross-field validation, not just schema validation</h3>\n<p>Schema validation would have passed the broken ticket. It was well-formed. So I added consistency rules:</p>\n<ul>\n<li>If <code>previously_working</code> is true, <code>issue_type</code> cannot be <code>how_to</code></li>\n<li>If <code>users_affected</code> is <code>many</code>, the ticket cannot be standard priority</li>\n<li>If a ticket references another ticket, that reference must resolve to a real one</li>\n<li>If confidence is below threshold on any field that drives routing, stop</li>\n</ul>\n<h3>Idempotency and deduplication</h3>\n<p>Every inbound message gets a deterministic key so a retry can't create the same ticket twice.</p>\n<p>But this build needed something beyond idempotency. The duplicates weren't retries. They were twelve different people reporting one real problem. Before creating an engineering ticket, the system now checks whether a similar ticket was created in the last few hours, using product area, affected feature, and quoted error text as the signature. If it matches, it links the new report to the existing ticket instead of creating a new one, and increments a counter.</p>\n<p>That counter turned out to be the single most valuable output of the whole system. Five reports of the same signature in an hour is an incident detector.</p>\n<h3>Retries and timeouts, used carefully</h3>\n<ul>\n<li>Retry transient failures with exponential backoff and jitter: timeouts, 429s, 503s, connection resets</li>\n<li>Do not retry everything — re-running an identical model call that failed validation usually just buys the same wrong answer twice</li>\n<li>Timeouts go on everything: model calls, API calls, the workflow overall. A hung request is worse than a failed one</li>\n</ul>\n<h3>Logging that answers the nine questions</h3>\n<p>A run ID threading through every step, plus raw message, prompt sent, raw model output, validation results, API parameters, response status and latency, and the final routing decision. Redact PII, mask credentials, be deliberate about retention.</p>\n<h3>Monitoring for the failure I actually had</h3>\n<p>Error alerts wouldn't have caught this, because nothing errored. So I monitor distributions:</p>\n<ul>\n<li>Issue type mix versus the trailing average — the alert that would have caught this within the hour</li>\n<li>Volume anomalies (forty tickets a day drops to six: nothing errored, something is very wrong)</li>\n<li>Validation failure rate — the early warning that input reality has shifted</li>\n<li>Human review queue rate trending sharply in either direction</li>\n<li>Duplicate-signature clustering — the incident detector</li>\n<li>API failure rate, latency creep, cost spikes</li>\n</ul>\n<h3>Human-in-the-loop with an actual threshold</h3>\n<p>A ticket routes to a human when: confidence is below threshold, <code>issue_type</code> is <code>unknown</code>, <code>users_affected</code> is <code>many</code>, a cross-field rule fails, or the deduplication check finds a cluster forming.</p>\n<blockquote>\n<p>The framing that sells this to clients: you're not replacing the human with AI. You're moving the support lead from triaging everything to deciding on the exceptions. That's a better job and a safer system.</p>\n</blockquote>\n<hr />\n<h2>8. Before and After</h2>\n<p><strong>BEFORE:</strong></p>\n<pre><code>Input → AI → API → Action\n</code></pre>\n<p><strong>AFTER:</strong></p>\n<pre><code>Input\n  → Input validation\n  → AI (extract + classify only)\n  → Structured output with escape hatches\n  → Schema validation\n  → Cross-field validation\n  → Deterministic routing logic\n  → Idempotency + duplicate check\n  → API call (with timeout)\n  → Error handling\n  → Retry if transient\n  → Logging\n  → Monitoring\n  → Human review queue if flagged\n  → Action\n</code></pre>\n<p>It looks like more work. It's maybe 30% more build time, and it's the cheapest insurance in this business.</p>\n<p>Why the second one survives contact with reality:</p>\n<ul>\n<li>It <strong>fails loudly</strong> instead of quietly. Every step ends in a known state.</li>\n<li>It <strong>fails early</strong> instead of late. Validation before the routing decision means a bad call never reaches a customer.</li>\n<li>It's <strong>debuggable</strong>. All nine questions answerable from logs. Days of archaeology become minutes of reading.</li>\n<li>It's <strong>safe to retry</strong>. Idempotency means recovery doesn't create new problems.</li>\n<li>It <strong>degrades instead of collapsing</strong>. A bad day means more tickets in the human queue, not wrong tickets in the wrong queue.</li>\n</ul>\n<blockquote>\n<p>Notice what didn't change: the AI is still one box in the middle. That proportion is the point. The model was never the hard part. The model is the easiest part.</p>\n</blockquote>\n<hr />\n<h2>9. The Biggest Thing I Got Wrong</h2>\n<p>The mistake wasn't technical. <strong>I treated the AI agent as the product.</strong></p>\n<p>It wasn't. The agent was the mechanism. The product was the business outcome: customers getting to the right person fast enough, without the support lead spending her mornings on clerical work.</p>\n<p>Once you see that, decisions reorder themselves. The client never cared that the model wrote an elegant ticket summary. They never asked which model I used. They never asked about my prompt. They asked one question, in various polite forms, every week:</p>\n<blockquote>\n<p>\"Are customers getting handled correctly?\"</p>\n</blockquote>\n<p>That's the spec. Not classification accuracy on a benchmark, not latency, not token cost. Did the business outcome happen, reliably, without anyone checking?</p>\n<p>I had optimized the wrong layer. I spent my best hours on classification quality and prompt design, which is the fun part, and almost none on the boring machinery that determines whether the outcome actually lands.</p>\n<blockquote>\n<p><strong>A mediocre model wrapped in excellent engineering beats an excellent model wrapped in nothing. Every time.</strong></p>\n</blockquote>\n<hr />\n<h2>10. What $3,000 Actually Bought</h2>\n<p>When someone pays for an AI agent, they are not buying \"some prompts plus an LLM plus automation.\" They believe they're buying a result that keeps happening. If you haven't explicitly priced and scoped that difference, you have just sold ongoing reliability at a one-time price.</p>\n<p>I now name the ladder out loud in the sales conversation:</p>\n<ol>\n<li><strong>Prototype.</strong> Proves the idea is possible. Runs when I run it. No reliability guarantees. Days of work, cheap.</li>\n<li><strong>Proof of concept.</strong> Proves it works on your real data, in your context, on a sample. Still operated by me, still not load-bearing. This is where most \"AI agent\" purchases actually land, and where most of the disappointment is born.</li>\n<li><strong>Production automation.</strong> Deterministic, rules-based, unattended, with validation and error handling. Reliable because the logic is fixed.</li>\n<li><strong>Production AI agent.</strong> Everything in the AFTER diagram. Escape hatches, cross-field validation, idempotency, deduplication, retries, timeouts, logging, monitoring, human fallback. Runs unattended and fails safely. Costs meaningfully more than a POC because it is meaningfully more work.</li>\n<li><strong>Managed AI system.</strong> All of the above, plus I'm accountable for it continuing to work. Monitoring is watched. Failures are triaged. Schemas and rules are maintained as the product, the team, and the ticket mix change. This is a retainer, because the work never stops.</li>\n</ol>\n<p>Five different products. They should not share a price, a timeline, or a support expectation. <strong>Selling level 2 at level 4 prices is fraud. Selling level 4 at level 2 prices, which is what I did, is just an expensive way to learn.</strong></p>\n<hr />\n<h2>11. What I'd Do Differently, and What You Should Steal</h2>\n<p>The relationship survived. I found it fast, told them plainly what happened, shipped the hardened version and the re-triage list without billing for it. That wasn't generosity. It was the cost of my own scoping error, and eating it was the cheapest reputational insurance available.</p>\n<p>What changed permanently:</p>\n<ul>\n<li>I ask <strong>\"what does a bad week look like?\"</strong> before I write a line. Every business process has a cycle. Release day, month-end, hiring season, peak season, the annual renewal crunch. If your test data covers two quiet weeks, you have tested one phase of a multi-phase system.</li>\n<li>Every enum gets <strong>unknown</strong>. Every classification gets a <strong>confidence</strong>. Every agent gets a way to say \"I'm not sure.\" If the model can't express doubt, it will express confidence instead, and you'll believe it.</li>\n<li>I ask the model for <strong>observations, not verdicts</strong>. \"Was this working before?\" is a reading task. \"How urgent is this?\" is a business rule. Keep the second one in code.</li>\n<li><strong>Deterministic code owns anything with consequences.</strong> The LLM handles ambiguity. Code handles actions.</li>\n<li>I build <strong>observability before features</strong>. Run IDs, raw input and output capture, one place to look. It takes an afternoon and saves days on every project after.</li>\n<li>I monitor <strong>distributions, not just errors</strong>. The failure that costs you the client is the one where every component returns success.</li>\n<li>I schedule a <strong>week-2 review</strong> before delivery. On the calendar, non-optional. I go look at the actual queues and the actual outcomes, not the logs.</li>\n<li>I never let an agent take an <strong>irreversible or customer-visible action without a gate</strong>. If it can't be undone, someone approves it.</li>\n</ul>\n<hr />\n<blockquote>\n<p><strong>Building an AI agent that works is a weekend.</strong><br />\n<strong>Building an AI agent that keeps working is the job.</strong></p>\n<p>The $3,000 didn't buy the agent. It bought the education, and I'm the one who paid for it.</p>\n</blockquote>", "tags": [], "links": [], "backlinks": [], "meta": {}}, {"title": "Work Log", "folder": "", "path": "/opt/data/ObsidianVault/Work Log.md", "html": "<h1>Work Log</h1>\n<p>Append-only record of every task completed. Newest at the top.<br />\nOne row per task. The detail lives in the linked note.</p>\n<p>Related: <a class=\" PDF (10 pages) + DOCX, emailed</td>\n<td><a class=\"wl\" data-target=\"15-Day AI Image Content Plan\">15-Day AI Image Content Plan</a> · <code>/opt/data/reports/</code></td>\n</tr>\n<tr>\n<td>2026-09-19</td>\n<td>Obsidian vault set up and seeded</td>\n<td>Vault with notes</td>\n<td><a class=\"wl\" data-target=\"Index\">Index</a></td>\n</tr>\n</tbody>\n</table>\n<h2>Rules for this log</h2>\n<ul>\n<li>Add a row when a task is finished, not when it starts.</li>\n<li>Link the task note, not the raw file, unless there is no note.</li>\n<li>Never log secrets, API keys or client credentials here.</li>\n</ul>", "tags": [], "links": ["15-Day AI Image Content Plan", "CVD Diamond Buyer Lead Report", "DeepSEEK V4.1 Model Jailbreak", "Diamond Business — Client Meeting Brief", "Index", "KP Group — Adverse Information", "KP Group — Company Profile", "Learn Easy AI — I Sold an AI Agent for $3,000"], "backlinks": [], "meta": {}}, {"title": "Task Note", "folder": "Templates", "path": "/opt/data/ObsidianVault/Templates/Task Note.md", "html": "<h1><Task title></h1>\n<h2>What was asked</h2>\n<p>One or two lines. The actual request, in the requester's words where possible.</p>\n<h2>What was delivered</h2>\n<ul>\n<li>The output, in plain language.</li>\n<li>What changed or was decided.</li>\n<li>What was verified with real evidence (tool output, readback, file check).</li>\n</ul>\n<h2>Files</h2>\n<ul>\n<li><code>/absolute/path/to/file.pdf</code> — what it is</li>\n<li><code>/absolute/path/to/file.docx</code> — what it is</li>\n</ul>\n<h2>Key facts worth keeping</h2>\n<ul>\n<li>Numbers, names, contacts, decisions — the things that would be expensive to re-derive.</li>\n</ul>\n<h2>Sent / published</h2>\n<ul>\n<li>Where it was sent, to whom, and the verification that confirms it.</li>\n</ul>\n<h2>Open items</h2>\n<ul>\n<li>Anything unfinished, unverified or flagged as a risk.</li>\n</ul>\n<h2>Sources</h2>\n<ul>\n<li>Links and documents this was built from.</li>\n</ul>", "tags": [], "links": const notes = DATA.notes, tagsMap = DATA.tags;
let activeTag = null, activeNote = null;

document.getElementById('built').textContent = 'vault live · built ' + DATA.built + ' · ' + notes.length + ' notes';

// ---------- A-Z index ----------
function renderList(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = document.getElementById('list');
  let pool = notes;
  if(activeTag) pool = pool.filter(n => n.tags.includes(activeTag));
  if(q) pool = pool.filter(n => (n.title + ' ' + n.html.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q));
  if(!pool.length){ list.innerHTML = '<div class="letter">NO MATCH</div>'; return; }
  const groups = {};
  pool.slice().sort((a,b)=>a.title.localeCompare(b.title)).forEach(n=>{
    const c = n.title.replace(/[^A-Za-z0-9]/,'').charAt(0).toUpperCase() || '#';
    (groups[c] = groups[c] || []).push(n);
  });
  let out = '';
  Object.keys(groups).sort().forEach(c=>{
    out += '<div class="letter">'+c+'</div>';
    groups[c].forEach(n=>{
      const isOn = n.title === activeNote ? ' on' : '';
      out += '<div class="item'+isOn+'" data-t="'+esc(n.title)+'"><span>'+esc(n.title)+'</span>'
           + (n.backlinks.length? '<span class="cnt">'+n.backlinks.length+'&#8592;</span>':'') + '</div>';
    });
  });
  list.innerHTML = out;
  list.querySelectorAll('.item').forEach(el=> el.onclick = ()=>{ show(el.dataset.t); if(innerWidth<=820) document.getElementById('side').classList.add('hide'); });
}

function renderTags(){
  const box = document.getElementById('tags');
  const names = Object.keys(tagsMap);
  box.innerHTML = names.map(t=>'<span class="tag'+(t===activeTag?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+' '+tagsMap[t].length+'</span>').join('');
  box.querySelectorAll('.tag').forEach(el=> el.onclick = ()=>{
    activeTag = (activeTag === el.dataset.t) ? null : el.dataset.t; renderTags(); renderList();
  });
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ---------- note viewer ----------
function show(title){
  const n = notes.find(x => x.title === title);
  if(!n) return;
  activeNote = title;
  const main = document.getElementById('main');
  let rel = '';
  if(n.links.length || n.backlinks.length){
    rel = '<div id="related">';
    if(n.links.length) rel += '<h4>Links to</h4>' + n.links.map(l=>'<span class="chip" data-t="'+esc(l)+'">'+esc(l)+'</span>').join('');
    if(n.backlinks.length) rel += '<h4 style="margin-top:14px">Linked from</h4>' + n.backlinks.map(l=>'<span class="chip" data-t="'+esc(l)+'">'+esc(l)+'</span>').join('');
    rel += '</div>';
  }
  main.innerHTML = '<h1>'+esc(n.title)+'</h1><div id="path">'+esc(n.path)+'</div><div class="note">'+n.html+'</div>'+rel;
  main.querySelectorAll('.chip').forEach(el=> el.onclick = ()=> show(el.dataset.t));
  main.querySelectorAll('.wl').forEach(el=> el.onclick = ()=>{
    const t = el.dataset.target;
    const hit = notes.find(x => x.title === t) || notes.find(x => x.title.toLowerCase() === t.toLowerCase());
    if(hit) show(hit.title); else alert('No note yet: ' + t);
  });
  main.scrollTop = 0;
  document.getElementById('topTitle').textContent = title;
  renderList();
}

document.getElementById('q').addEventListener('input', renderList);
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement.id !== 'q'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key === 'Escape'){ document.getElementById('q').value=''; renderList(); }
});
document.getElementById('menu').onclick = ()=> document.getElementById('side').classList.toggle('hide');

// ---------- heartbeat: auto-reload when the file is rebuilt (works when served over http) ----------
const START = DATA.builtEpoch;
if(location.protocol.startsWith('http')){
  setInterval(async ()=>{
    try{
      const r = await fetch(location.pathname + '?hb=' + Date.now(), {method:'HEAD', cache:'no-store'});
      const lm = Date.parse(r.headers.get('last-modified') || '');
      if(lm && lm/1000 > START + 5) location.reload();
    }catch(e){}
  }, 60000);
}

renderTags(); renderList();
const first = notes.find(n => n.title.toLowerCase() === 'index') || notes[0];
if(first) show(first.title);
</script>
