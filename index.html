*{box-sizing:border-box}

.item:hover{background:var(--hover)}
.item.on{background:var(--hover);border-left-color:var(--accent);color:#fff}
.item .cnt{font-size:11px;color:var(--dim)}
#main{flex:1;overflow:auto;padding:34px 46px 90px;max-width:1000px}
#main h1{font-size:27px;margin:0 0 6px;line-height:1.25}
#path{font-size:11.5px;color:var(--dim);font-family:ui-monospace,Menlo,monospace;margin-bottom:22px;word-break:break-all}
.note h2{font-size:18px;margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.note h3{font-size:15px;margin:20px 0 6px;color:#cbd5e1}
.note p{margin:9px 0}
.note ul,.note ol{margin:9px 0;padding-left:22px}
.note li{margin:4px 0}
.note code{background:#0b1016;padding:2px 5px;border-radius:4px;font-size:12.5px;font-family:ui-monospace,Menlo,monospace;color:#f0b47a}
.note pre{background:#0b1016;padding:13px;border-radius:8px;overflow:auto;border:1px solid var(--line)}
.note pre code{background:none;padding:0;color:#c9d6e2}
.note table{border-collapse:collapse;width:100%;margin:13px 0;font-size:13px}
.note th,.note td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.note th{background:#1b2532;font-weight:600}
.note tr:nth-child(even) td{background:#131a22}
.note blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--accent);background:#141b24;color:#c3ced9}
.wl{color:var(--link);cursor:pointer;border-bottom:1px dotted var(--link);text-decoration:none}

#related{margin-top:38px;padding-top:16px;border-top:1px solid var(--line);font-size:13px}

.chip{display:inline-block;margin:0 6px 6px 0;padding:4px 10px;border-radius:20px;background:#1b2532;border:1px solid var(--line);cursor:pointer;color:#c6d2de}
.chip:hover{border-color:var(--accent);color:#fff}
.empty{color:var(--dim);font-style:italic}
#top{display:none;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center;gap:10px}
#menu{background:none;border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 11px;cursor:pointer}
@media(max-width:820px){

<script>
const DATA = {"built": "20 Sep 2026, 11:30 UTC", "builtEpoch": 1789903834, "vault": "/opt/data/ObsidianVault", "notes": [{"title": "15-Day AI Image Content Plan", "folder": "", "path": "/opt/data/ObsidianVault/15-Day AI Image Content Plan.md", "html": "<h1>15-Day AI Image Content Plan</h1>\n<p>Related: <a class=\"wl\" data-target=\"AI Image Prompt Formula\">AI Image Prompt Formula</a> · <a class=\"wl\" data-target=\"CraftLouder — Service Lines\">CraftLouder — Service Lines</a></p>\n<p>Instagram content plan teaching an audience how to create images with AI.<br />\nDelivered 19 Sep 2026 to <strong>Hasti Kachhadiya</strong> and <strong>Prakruti Vaghasiya</strong>.</p>\n<h2>Structure that works</h2>\n<ul>\n<li>Content mix: ~40% educational, 25% proof, 25% story, 10% offer</li>\n<li>One anchor post daily plus stories; reply to comments within the first 60 minutes</li>\n<li>Batch production: generate a week of images in one sitting, write captions in a second</li>\n</ul>\n<h2>The 15 days</h2>\n<table>\n<thead>\n<tr>\n<th>Day</th>\n<th>Theme</th>\n<th>Format</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>AI images 101: what it actually is</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>2</td>\n<td>The 5 tools that matter right now</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Your first AI image in 60 seconds</td>\n<td>Reel</td>\n</tr>\n<tr>\n<td>4</td>\n<td>The 5-part prompt formula</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Lighting: one word changes everything</td>\n<td>Before/after</td>\n</tr>\n<tr>\n<td>6</td>\n<td>3 rules before you post an AI image</td>\n<td>Reel</td>\n</tr>\n<tr>\n<td>7</td>\n<td>Week 1 recap + Q&amp;A</td>\n<td>Stories</td>\n</tr>\n<tr>\n<td>8</td>\n<td>Camera language: make AI look photographed</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>9</td>\n<td>Your brand look, locked in one prompt</td>\n<td>Reel</td>\n</tr>\n<tr>\n<td>10</td>\n<td>Text inside images works now</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>11</td>\n<td>One product photo → 10 ad creatives</td>\n<td>Reel</td>\n</tr>\n<tr>\n<td>12</td>\n<td>Fix the 6 classic AI mistakes</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>13</td>\n<td>AI + real photo: the hybrid workflow</td>\n<td>Reel</td>\n</tr>\n<tr>\n<td>14</td>\n<td>Ethics, disclosure, what never to generate</td>\n<td>Carousel</td>\n</tr>\n<tr>\n<td>15</td>\n<td>The 15-day challenge + offer</td>\n<td>Reel + stories</td>\n</tr>\n</tbody>\n</table>\n<h2>Tools referenced</h2>\n<ul>\n<li>ChatGPT image generation — conversational editing, quick concepts</li>\n<li>Google Gemini / Nano Banana Pro (Gemini 3 Pro Image) — best text rendering, infographics</li>\n<li>Midjourney — most art-directed look</li>\n<li>Flux / Stable Diffusion — full control, local, no per-image cost</li>\n<li>Ideogram / Leonardo / Adobe Firefly — logos, lettering, commercially safe</li>\n</ul>\n<h2>Metrics that matter</h2>\n<p>Saves first, shares/sends second, comments in the first hour third. Likes tell you little.</p>\n<h2>Delivered artefacts</h2>\n<ul>\n<li><code>/opt/data/reports/15_Day_Instagram_Content_Plan_AI_Image_Creation.pdf</code> (10 pages)</li>\n<li>Same in <code>.docx</code> (editable captions)</li>\n</ul>", "tags": ["content", "instagram", "social-media", "ai-images"], "links": ["AI Image Prompt Formula", "CraftLouder — Service Lines"], "backlinks": ["AI Image Prompt Formula", "Index", "Work Log"], "meta": {"status": "delivered", "date": "2026-09-19", "recipients": ["hastikachhadiya2006@gmail.com", "vaghasiyaprakruti16@gmail.com"]}}, {"title": "AI Image Prompt Formula", "folder": "", "path": "/opt/data/ObsidianVault/AI Image Prompt Formula.md", "html": "<h1>AI Image Prompt Formula</h1>\n<p>Related: <a class=\"wl\" data-target=\"15-Day AI Image Content Plan\">15-Day AI Image Content Plan</a></p>\n<p>Five parts, in this order. Two lines is enough — never write paragraphs.</p>\n<table>\n<thead>\n<tr>\n<th>Part</th>\n<th>What it does</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1. Subject</td>\n<td>What or who is in the frame</td>\n<td>\"A ceramic coffee cup\"</td>\n</tr>\n<tr>\n<td>2. Action / context</td>\n<td>What is happening, and where</td>\n<td>\"on a café counter beside an open laptop\"</td>\n</tr>\n<tr>\n<td>3. Style &amp; medium</td>\n<td>Photo, 3D, watercolour, editorial, film</td>\n<td>\"editorial product photograph\"</td>\n</tr>\n<tr>\n<td>4. Lighting &amp; mood</td>\n<td>How it is lit and how it should feel</td>\n<td>\"warm golden-hour light, calm mood\"</td>\n</tr>\n<tr>\n<td>5. Technical</td>\n<td>Lens, aperture, angle, grain, aspect ratio</td>\n<td>\"85mm, f/1.8, eye level, 4:5\"</td>\n</tr>\n</tbody>\n</table>\n<h2>Full example</h2>\n<blockquote>\n<p>A ceramic coffee cup on a café counter beside a laptop, editorial product photograph,<br />\nwarm golden-hour light, shot on 85mm at f/1.8, shallow depth of field, 4:5</p>\n</blockquote>\n<h2>Lighting vocabulary (cheapest upgrade)</h2>\n<p>golden hour · soft diffused window light · rim light · overcast · neon night · candlelit ·<br />\nstudio softbox · harsh overhead noon light</p>\n<h2>Camera vocabulary</h2>\n<ul>\n<li>Focal length: 35mm (scene), 85mm (portrait), 100mm macro (detail)</li>\n<li>Aperture: f/1.8 (blurred background), f/8 (everything sharp)</li>\n<li>Film: Kodak Portra 400, Cinestill 800T, 35mm grain</li>\n<li>Angle: drone, eye level, low angle, overhead flat-lay</li>\n<li>Authenticity: \"shot on iPhone, unedited, natural light\"</li>\n</ul>\n<h2>Brand consistency rule</h2>\n<p>Lock three things and repeat them in every prompt: a two-colour palette (hex codes work),<br />\none lighting style, one aspect ratio. Ten images, one identity.</p>\n<h2>The 6 classic AI mistakes to check</h2>\n<ol>\n<li>Hands and fingers — count them</li>\n<li>Garbled text — zoom in every time</li>\n<li>Extra limbs or objects at frame edges</li>\n<li>Shadows that do not match the light source</li>\n<li>Plastic, over-smooth skin</li>\n<li>Reflections and mirrors showing the wrong thing</li>\n</ol>\n<p>Fix with a targeted edit: \"fix the left hand, keep everything else identical.\"</p>", "tags": ["reference", "ai-images", "prompts"], "links": ["15-Day AI Image Content Plan"], "backlinks": ["15-Day AI Image Content Plan", "Index"], "meta": {"status": "active"}}, {"title": "CraftLouder — Service Lines", "folder": "", "path": "/opt/data/ObsidianVault/CraftLouder — Service Lines.md", "html": "<h1>CraftLouder — Service Lines</h1>\n<p>Related: <a class=\"wl\" data-target=\"CraftLouder — Working Rules\">CraftLouder — Working Rules</a> · <a class=\"wl\" data-target=\"KP Group — Company Profile\">KP Group — Company Profile</a></p>\n<h2>What we sell</h2>\n<ol>\n<li><strong>Websites</strong> — Next.js/React front end with FastAPI back end. Performance, design systems,<br />\n   multi-site consolidation, CRO and landing pages.</li>\n<li><strong>AI chatbots trained on your documents</strong> — Pinecone-backed retrieval over a client's own<br />\n   SOPs, tenders, product docs or investor material.</li>\n<li><strong>AI voice receptionists</strong> — first-line call handling and routing, useful for multi-branch<br />\n   businesses and helpdesks.</li>\n<li><strong>Automation</strong> — n8n and Zapier workflows for reporting, order-to-cash and repetitive ops.</li>\n<li><strong>E-commerce</strong> — Shopify builds and migrations.</li>\n</ol>\n<h2>How we pitch</h2>\n<ul>\n<li>Lead with a concrete, measurable problem (page speed, enquiry handling, reporting load),<br />\n  never with \"we do AI\".</li>\n<li>Direct founder access is the differentiator — say it plainly.</li>\n<li>Entry point for large groups is never the chairman; find the operating executive<br />\n  (group CEO, a new executive director) and warm them up on LinkedIn first.</li>\n<li>Buyers already using AI tools are the easiest conversation — check whether their site<br />\n  references AI, ChatGPT or automation before approaching.</li>\n</ul>\n<h2>Proof points to reuse</h2>\n<ul>\n<li>Lucy AI · DRYAM FOODS · Flatify AI · NCD AI · AI Sales Pipeline</li>\n</ul>", "tags": ["craftlouder", "services"], "links": ["CraftLouder — Working Rules", "KP Group — Company Profile"], "backlinks": ["15-Day AI Image Content Plan", "CraftLouder — Working Rules", "Index", "KP Group — Company Profile"], "meta": {"status": "active"}}, {"title": "CraftLouder — Working Rules", "folder": "", "path": "/opt/data/ObsidianVault/CraftLouder — Working Rules.md", "html": "<h1>CraftLouder — Working Rules</h1>\n<p>Related: <a class=\"wl\" data-target=\"CraftLouder — Service Lines\">CraftLouder — Service Lines</a> · <a class=\"wl\" data-target=\"Index\">Index</a></p>\n<h2>Brand</h2>\n<ul>\n<li>Tagline: <em>We build websites and AI tools that help your business grow.</em></li>\n<li>Services: Next.js/React + FastAPI sites · AI doc-trained chatbots (Pinecone) ·<br />\n  AI voice receptionists · n8n/Zapier automation · Shopify e-commerce</li>\n<li>Founder: <strong>Bhargav Thummar</strong> · Co-Founder: <strong>Prachi Kakadiya</strong></li>\n<li>info@craftlouder.com · +91 84909 02899 · New Delhi</li>\n<li>X @craftlouderai · linkedin/company/craftlouder · github/craftlouder</li>\n<li>Positioning: direct founder access, no agency middle layer</li>\n</ul>\n<h2>Delivery conventions</h2>\n<ul>\n<li>Reports ship as <strong>PDF + DOCX</strong> (DOCX so the client can edit)</li>\n<li>PDFs are built from a JSON spec with <code>make_pdf.py</code>; DOCX with the <code>docx</code> skill's<br />\n<code>docx_create.py</code>, then <code>fix_docx_breaks.py</code> so multi-line captions keep their line breaks</li>\n<li>Business mail goes out from <strong>craftlouder-team@agentmail.to</strong> via the AgentMail API</li>\n<li>Never claim a mail was sent without reading it back from the sent folder</li>\n<li>Never invent leads, contacts or figures — if it cannot be sourced, say so in the document</li>\n</ul>\n<h2>Known environment facts</h2>\n<ul>\n<li><strong>Notes web page (live):</strong> https://bhargavtz.github.io/craftlouder-notes/ — every vault note,<br />\n  A–Z index, search, tags, backlinks. HTTPS. Rebuilt from the vault every 30 minutes by the<br />\n<code>vault-site-rebuild</code> cron, and immediately after any note is saved via <code>bash /opt/data/scripts/vault_site.sh</code>.<br />\n  Generator: <code>/opt/data/reports/build_vault_site.py</code> → <code>/opt/data/vault-site/index.html</code>.</li>\n<li>Nightly capture: cron <code>vault-task-log-nightly</code> (7:00 PM IST) sweeps the day's sessions into the vault.</li>\n<li>Headless Docker container: no desktop, no Obsidian GUI app</li>\n<li>Vault is filesystem-first at <code>/opt/data/ObsidianVault</code></li>\n<li>Python work uses <code>/opt/data/.venv/bin/python</code>; no pip, use <code>uv</code></li>\n<li>No sudo; 7-Zip at <code>/opt/data/tools/7zip/7zz</code></li>\n</ul>", "tags": ["craftlouder", "brand", "rules"], "links": ["CraftLouder — Service Lines", "Index"], "backlinks": ["CraftLouder — Service Lines", "Index"], "meta": {"status": "active"}}, {"title": "Index", "folder": "", "path": "/opt/data/ObsidianVault/Index.md", "html": "<h1>Hermes Vault — Index</h1>\n<p>Vault path: <code>/opt/data/ObsidianVault</code><br />\nOwner: CraftLouder · maintained by Hermes</p>\n<blockquote>\n<p><strong>Live web view:</strong> http://srv1767463.hstgr.cloud:8099/ — every note, A–Z index, search,<br />\ntags and backlinks. Rebuilt from this vault every 30 minutes.</p>\n</blockquote>\n<h2>Research</h2>\n<ul>\n<li><a class=\"wl\" data-target=\"KP Group — Company Profile\">KP Group — Company Profile</a> — Surat renewable energy conglomerate, decision-makers and contacts</li>\n<li><a class=\"wl\" data-target=\"KP Group — Adverse Information\">KP Group — Adverse Information</a> — land conflicts, governance flags, court matters</li>\n<li><a class=\"wl\" data-target=\"CraftLouder — Service Lines\">CraftLouder — Service Lines</a> — what we sell and who we sell it to</li>\n</ul>\n<h2>Content &amp; Marketing</h2>\n<ul>\n<li><a class=\"wl\" data- laints against 29 named<br />\n   and ~150 unnamed protesters. Grievances to the Chief Minister reportedly went unanswered.</li>\n<li><strong>Right-of-way protests hit guidance.</strong> KP Energy cut FY27 revenue growth guidance to<br />\n   30–40% citing right-of-way protests (Sahi, 13 Aug 2026).</li>\n<li><strong>Ghoda village, Bharuch.</strong> Gram Sabha unanimously opposed a solar project; 31 farmers<br />\n   complained to the Chief Minister on 18 Sep 2025, alleging damage to ~30 irrigation pipelines.<br />\n   ⚠️ Recorded under \"KP Green Energy\" — <strong>not confirmed</strong> to be KPI Green Energy Ltd.</li>\n</ol>\n<h2>Financial and governance flags</h2>\n<ul>\n<li>Promoters of KPI Green Energy have pledged <strong>44.7%</strong> of their holding</li>\n<li><strong>₹5,500 crore</strong> of related-party transactions taken to shareholders</li>\n<li>CRISIL flagged <strong>₹2,750 crore</strong> debt-funded wind and BESS capex; NCD rating is AA+<strong>(CE)</strong></li>\n<li>Q1 FY27 net profit down ~14–15% YoY; <strong>CFO resigned effective 2 Sep 2026</strong></li>\n<li>KPGE and KP Energy both traded near 52-week lows (Aug 2026)</li>\n</ul>\n<h2>Court matters (verified full text)</h2>\n<ul>\n<li><strong>KPI Green Energy Ltd vs State of Gujarat</strong> — C/SCA/15246/2025, 14 Nov 2025. Land-use /<br />\n  Section 63AA tenancy dispute; petition disposed with liberty to re-apply.</li>\n<li><strong>M/s KP Green Engineering Ltd vs Union of India</strong> — C/SCA/6144/2025, 25 Jul 2025.<br />\n  GST Section 74 order <strong>quashed</strong> in the company's favour.</li>\n</ul>\n<h2>Searched and NOT found</h2>\n<p>No SEBI enforcement order · no ED/CBI/income-tax raid · no fraud or scam allegation ·<br />\nno auditor resignation · no insolvency proceeding · no exchange penalty.</p>\n<h2>Unattributed</h2>\n<p>A Gujarat HC criminal petition by \"Lameez w/o Hassan Faruk Patel\" was withdrawn on<br />\n28 Nov 2025 after settlement. Identity with the group's whole-time =\"wl\" data-target=\"Index\">Index</a></p>\n<table>\n<thead>\n<tr>\n<th>Date</th>\n<th>Task</th>\n<th>Deliverable</th>\n<th>Where</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2026-09-19</td>\n<td>KP Group — company profile and decision-maker data</td>\n<td>PDF + DOCX report</td>\n<td><a class=\"wl\" data-target=\"KP Group — Company Profile\">KP Group — Company Profile</a> · <code>/opt/data/reports/</code></td>\n</tr>\n<tr>\n<td>2026-09-19</td>\n<td>KP Group — adverse information and risk research</td>\n<td>PDF + DOCX report (5 pages)</td>\n<td><a class=\"wl\" data-target=\"KP Group — Adverse Information\">KP Group — Adverse Information</a> · <code>/opt/data/reports/</code></td>\n</tr>\n<tr>\n<td>2026-09-19</td>\n<td>15-day Instagram content plan on AI image creation</td>\n<td>PDF (10 pages) + DOCX, emailed</td>\n<td><a class=\"wl\" data-target=\"15-Day AI Image Content Plan\">15-Day AI Image Content Plan</a> · <code>/opt/data/reports/</code></td>\n</tr>\n<tr>\n<td>2026-09-19</td>\n<td>Obsidian vault set up and seeded</td>\n<td>Vault with 7 notes</td>\n<td><a class=\"wl\" data-target=\"Index\">Index</a></td>\n</tr>\n</tbody>\n</table>\n<h2>Rules for this log</h2>\n<ul>\n<li>Add a row when a task is finished, not when it starts.</li>\n<li>Link the task note, not the raw file, unless there is no note.</li>\n<li>Never log secrets, API keys or client credentials here.</li>\n</ul>", "tags": [], "links": ["15-Day AI Image Content Plan", "Index", "KP Group — Adverse Information", "KP Group — Company Profile"], "backlinks": [], "meta": {}}, {"title": "Task Note", "folder": "Templates", "path": "/opt/data/ObsidianVault/Templates/Task Note.md", "html": "<h1><Task title></h1>\n<h2>What was asked</h2>\n<p>One or two lines. The actual request, in the requester's words where possible.</p>\n<h2>What was delivered</h2>\n<ul>\n<li>The output, in plain language.</li>\n<li>What changed or was decided.</li>\n<li>What was verified with real evidence (tool output, readback, file check).</li>\n</ul>\n<h2>Files</h2>\n<ul>\n<li><code>/absolute/path/to/file.pdf</code> — what it is</li>\n<li><code>/absolute/path/to/file.docx</code> — what it is</li>\n</ul>\n<h2>Key facts worth keeping</h2>\n<ul>\n<li>Numbers, names, contacts, decisions — the things that would be expensive to re-derive.</li>\n</ul>\n<h2>Sent / published</h2>\n<ul>\n<li>Where it was sent, to whom, and the verification that confirms it.</li>\n</ul>\n<h2>Open items</h2>\n<ul>\n<li>Anything unfinished, unverified or flagged as a risk.</li>\n</ul>\n<h2>Sources</h2>\n<ul>\n<li>Links and documents this was built from.</li>\n</ul>", "tags": [], "links": [], "backlinks": [], "meta": {"date": "YYYY-MM-DD", "type": "task", "status": "done", "owner": "Bhargav", "deliverables": [], "sources": []}}], "tags": {"ai-images": ["15-Day AI Image Content Plan", "AI Image Prompt Formula"], "brand": ["CraftLouder — Working Rules"], "content": ["15-Day AI Image Content Plan"], "craftlouder": ["CraftLouder — Service Lines", "CraftLouder — Working Rules"], "due-diligence": ["KP Group — Adverse Information"], "instagram": ["15-Day AI Image Content Plan"], "prompts": ["AI Image Prompt Formula"], "prospect": ["KP Group — Company Profile"], "reference": ["AI Image Prompt Formula"], "renewable-energy": ["KP Group — Company Profile"], "research": ["KP Group — Adverse Information", "KP Group — Company Profile"], "risk": ["KP Group — Adverse Information"], "rules": ["CraftLouder — Working Rules"], "services": ["CraftLouder — Service Lines"], "social-media": ["15-Day AI Image Content Plan"]}};
const notes = DATA.notes, tagsMap = DATA.tags;
let activeTag = null, activeNote = null;

document.getElementById('built').textContent = 'vault live · built ' + DATA.built + ' · ' + notes.length + ' notes';

// ---------- A-Z index ----------
function renderList(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = document.getElementById('list');
  let pool = notes;
  if(activeTag) pool = pool.filter(n => n.tags.includes(activeTag));
  if(q) pool = pool.filter(n => (n.title + ' ' + n.html.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q));
  if(!pool.length){ list.innerHTML = '<div class="letter">NO MATCH</div>'; return; }
  const groups = {};
  pool.slice().sort((a,b)=>a.title.localeCompare(b.title)).forEach(n=>{
    const c = n.title.replace(/[^A-Za-z0-9]/,'').charAt(0).toUpperCase() || '#';
    (groups[c] = groups[c] || []).push(n);
  });
  let out = '';
  Object.keys(groups).sort().forEach(c=>{
    out += '<div class="letter">'+c+'</div>';
    groups[c].forEach(n=>{
      const isOn = n.title === activeNote ? ' on' : '';
      out += '<div class="item'+isOn+'" data-t="'+esc(n.title)+'"><span>'+esc(n.title)+'</span>'
           + (n.backlinks.length? '<span class="cnt">'+n.backlinks.length+'&#8592;</span>':'') + '</div>';
    });
  });
  list.innerHTML = out;
  list.querySelectorAll('.item').forEach(el=> el.onclick = ()=>{ show(el.dataset.t); if(innerWidth<=820) document.getElementById('side').classList.add('hide'); });
}

function renderTags(){
  const box = document.getElementById('tags');
  const names = Object.keys(tagsMap);
  box.innerHTML = names.map(t=>'<span class="tag'+(t===activeTag?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+' '+tagsMap[t].length+'</span>').join('');
  box.querySelectorAll('.tag').forEach(el=> el.onclick = ()=>{
    activeTag = (activeTag === el.dataset.t) ? null : el.dataset.t; renderTags(); renderList();
  });
}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ---------- note viewer ----------
function show(title){
  const n = notes.find(x => x.title === title);
  if(!n) return;
  activeNote = title;
  const main = document.getElementById('main');
  let rel = '';
  if(n.links.length || n.backlinks.length){
    rel = '<div id="related">';
    if(n.links.length) rel += '<h4>Links to</h4>' + n.links.map(l=>'<span class="chip" data-t="'+esc(l)+'">'+esc(l)+'</span>').join('');
    if(n.backlinks.length) rel += '<h4 style="margin-top:14px">Linked from</h4>' + n.backlinks.map(l=>'<span class="chip" data-t="'+esc(l)+'">'+esc(l)+'</span>').join('');
    rel += '</div>';
  }
  main.innerHTML = '<h1>'+esc(n.title)+'</h1><div id="path">'+esc(n.path)+'</div><div class="note">'+n.html+'</div>'+rel;
  main.querySelectorAll('.chip').forEach(el=> el.onclick = ()=> show(el.dataset.t));
  main.querySelectorAll('.wl').forEach(el=> el.onclick = ()=>{
    const t = el.dataset.target;
    const hit = notes.find(x => x.title === t) || notes.find(x => x.title.toLowerCase() === t.toLowerCase());
    if(hit) show(hit.title); else alert('No note yet: ' + t);
  });
  main.scrollTop = 0;
  document.getElementById('topTitle').textContent = title;
  renderList();
}

document.getElementById('q').addEventListener('input', renderList);
document.addEventListener('keydown', e=>{
  if(e.key === '/' && document.activeElement.id !== 'q'){ e.preventDefault(); document.getElementById('q').focus(); }
  if(e.key === 'Escape'){ document.getElementById('q').value=''; renderList(); }
});
document.getElementById('menu').onclick = ()=> document.getElementById('side').classList.toggle('hide');

// ---------- heartbeat: auto-reload when the file is rebuilt (works when served over http) ----------
const START = DATA.builtEpoch;
if(location.protocol.startsWith('http')){
  setInterval(async ()=>{
    try{
      const r = await fetch(location.pathname + '?hb=' + Date.now(), {method:'HEAD', cache:'no-store'});
      const lm = Date.parse(r.headers.get('last-modified') || '');
      if(lm && lm/1000 > START + 5) location.reload();
    }catch(e){}
  }, 60000);
}

renderTags(); renderList();
const first = notes.find(n => n.title.toLowerCase() === 'index') || notes[0];
if(first) show(first.title);
</script>
